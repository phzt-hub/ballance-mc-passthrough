# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4

# Mod Properties
version=1.0.0
group=com.example

# Dependencies
fabric_api_version=0.162.0+26.3

# NOTE: 全局 ~/.gradle/gradle.properties 里 pin 了 org.gradle.java.home=java-21
#（给火车时刻表 Android 工程用的），而全局配置优先级高于本文件，
# 所以本行对 daemon 选 JVM 不起作用。构建本工程请用 ./gradlew25
#（它会自动加上 -Dorg.gradle.java.home 指向 Java 25），不要直接用 ./gradlew。
org.gradle.java.home=/usr/lib/jvm/jdk-25.0.4.1-oracle-x64
